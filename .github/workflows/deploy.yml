name: Build and publish website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Determine GitHub Pages address
        id: address
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          repo="${REPOSITORY#*/}"
          owner_lower="${OWNER,,}"
          echo "site=https://${owner_lower}.github.io" >> "$GITHUB_OUTPUT"
          if [ "${repo,,}" = "${owner_lower}.github.io" ]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/${repo}" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run build
        env:
          SITE_URL: ${{ steps.address.outputs.site }}
          BASE_PATH: ${{ steps.address.outputs.base }}
      - run: npm run check:content
        env:
          BASE_PATH: ${{ steps.address.outputs.base }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
